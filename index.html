<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content" />
    <meta name="theme-color" content="#050507" />
    <meta name="description" content="Darkblood: Overture — a dark-fantasy 2D browser game." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Darkblood" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./orientation.css" />
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
    <title>Darkblood: Overture</title>
  </head>
  <body>
    <main id="app" aria-label="Darkblood: Overture">
      <div id="game-shell">
        <div id="game-container"></div>

        <section
          id="orientation-gate"
          aria-live="polite"
          role="button"
          tabindex="0"
          aria-label="Orientation gate. Rotate your device to landscape."
        >
          <div class="orientation-backdrop"></div>
          <div class="orientation-card">
            <div id="orientation-symbol" class="orientation-symbol">⟲</div>
            <p id="orientation-kicker" class="orientation-kicker">Darkblood: Overture</p>
            <h1 id="orientation-title" class="orientation-title">Landscape only</h1>
            <p id="orientation-message" class="orientation-message">Turn your device sideways to enter the game.</p>
            <button id="orientation-continue" type="button" hidden>Enter the Overture</button>
            <p id="orientation-hint" class="orientation-hint">The game is locked to landscape.</p>
          </div>
        </section>
      </div>
    </main>

    <script defer src="./orientation.js"></script>
    <script defer src="./service-worker-register.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
