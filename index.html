<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050507" />
    <meta name="description" content="Darkblood: Overture — a dark-fantasy 2D browser game." />
    <title>Darkblood: Overture</title>
  </head>
  <body>
    <main id="app" aria-label="Darkblood: Overture">
      <div id="game-shell">
        <div id="game-container"></div>
        <div id="orientation-warning" aria-live="polite">
          <div class="orientation-card">
            <div class="orientation-symbol">⟲</div>
            <p>Landscape only.</p>
            <span>Turn your device sideways to enter the game.</span>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
