<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content" />
    <meta name="theme-color" content="#050507" />
    <meta name="description" content="Darkblood: Overture — a dark-fantasy 2D browser game." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Darkblood" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
    <title>Darkblood: Overture</title>
  </head>
  <body>
    <main id="app" aria-label="Darkblood: Overture">
      <div id="game-shell">
        <div id="game-container"></div>

        <section
          id="orientation-gate"
          class="fixed inset-0 z-[1000] grid cursor-pointer touch-manipulation place-items-center bg-[#050507] px-6 py-8"
          aria-live="polite"
          role="button"
          tabindex="0"
          aria-label="Orientation gate. Rotate to landscape, then tap anywhere to continue."
        >
          <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(109,40,217,0.16),transparent_62%)]"></div>
          <div class="relative w-full max-w-md overflow-hidden rounded-sm border border-violet-300/25 bg-black/75 px-7 py-8 text-center shadow-[0_0_60px_rgba(124,58,237,0.14)] backdrop-blur-sm">
            <div class="mx-auto mb-5 grid h-16 w-16 place-items-center rounded-full border border-violet-200/35 bg-violet-950/25 text-3xl text-violet-200 shadow-[0_0_28px_rgba(168,85,247,0.16)]" id="orientation-symbol">⟲</div>
            <p id="orientation-kicker" class="mb-2 font-serif text-[0.68rem] font-medium uppercase tracking-[0.42em] text-violet-300/70">Darkblood: Overture</p>
            <h1 id="orientation-title" class="mb-4 font-serif text-2xl font-semibold uppercase tracking-[0.18em] text-[#f4f0e7] drop-shadow-[0_0_12px_rgba(196,132,252,0.16)]">Landscape only</h1>
            <p id="orientation-message" class="mx-auto max-w-sm font-serif text-sm leading-6 text-violet-100/70">Turn your device sideways to enter the game.</p>
            <button id="orientation-continue" type="button" class="mt-7 hidden border border-violet-200/35 bg-violet-950/35 px-6 py-3 font-serif text-xs uppercase tracking-[0.28em] text-[#f4f0e7] shadow-[0_0_22px_rgba(168,85,247,0.12)] transition hover:bg-violet-900/40 focus:outline-none focus:ring-2 focus:ring-violet-300/50 active:scale-[0.98]">Enter the Overture</button>
            <p id="orientation-hint" class="mt-5 text-[0.63rem] uppercase tracking-[0.22em] text-violet-200/35">The game is locked to landscape.</p>
          </div>
        </section>
      </div>
    </main>

    <script>
      (() => {
        const gate = document.getElementById('orientation-gate');
        const title = document.getElementById('orientation-title');
        const message = document.getElementById('orientation-message');
        const symbol = document.getElementById('orientation-symbol');
        const button = document.getElementById('orientation-continue');
        const hint = document.getElementById('orientation-hint');

        let landscapeReady = false;
        let acknowledged = false;

        const isLandscape = () => {
          const mediaLandscape = window.matchMedia('(orientation: landscape)').matches;
          const viewportLandscape = window.innerWidth > window.innerHeight;
          return mediaLandscape || viewportLandscape;
        };

        const updateOrientationState = () => {
          landscapeReady = isLandscape();
          if (acknowledged) return;

          if (landscapeReady) {
            symbol.textContent = '✦';
            title.textContent = 'Landscape detected';
            message.textContent = 'The veil is open. Tap anywhere to enter the Overture.';
            button.classList.remove('hidden');
            hint.textContent = 'Tap anywhere to continue';
            gate.setAttribute('aria-label', 'Landscape detected. Tap anywhere to continue.');
          } else {
            symbol.textContent = '⟲';
            title.textContent = 'Landscape only';
            message.textContent = 'Turn your device sideways to enter the game.';
            button.classList.add('hidden');
            hint.textContent = 'The game is locked to landscape.';
            gate.setAttribute('aria-label', 'Orientation gate. Rotate your device to landscape.');
          }
        };

        const acknowledge = () => {
          if (!landscapeReady || acknowledged) return;
          acknowledged = true;
          button.disabled = true;
          gate.classList.add('orientation-gate-exit');
          window.dispatchEvent(new Event('darkblood:orientation-ready'));
          window.setTimeout(() => gate.remove(), 420);
        };

        const onKeydown = (event) => {
          if ((event.key === 'Enter' || event.key === ' ') && landscapeReady) {
            event.preventDefault();
            acknowledge();
          }
        };

        window.addEventListener('orientationchange', updateOrientationState, { passive: true });
        window.addEventListener('resize', updateOrientationState, { passive: true });
        gate.addEventListener('pointerup', acknowledge);
        gate.addEventListener('keydown', onKeydown);
        updateOrientationState();
      })();
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
